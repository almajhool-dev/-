name: Build TK_SABR Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release and Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue || gradle testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease || gradle assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TK_SABR-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TK_SABR-release-apk
          path: app/build/outputs/apk/release/*.apk
